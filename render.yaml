services:
  - type: web
    name: kivora-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://kivora-api-n7m1.onrender.com
      - key: VITE_API_BASE_URL
        value: https://kivora-api-n7m1.onrender.com
    routes:
      - type: rewrite
        source: /api/*
        destination: https://kivora-api-n7m1.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: kivora-api
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        value: sqlite:///./kivora.db
      - key: SECRET_KEY
        generateValue: true
      - key: KIVORA_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false

