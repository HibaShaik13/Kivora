services:
  # Kivora FastAPI Backend Service
  - type: web
    name: kivora-api
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: KIVORA_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: kivora-postgres
          property: connectionString
      - key: KIVORA_CORS_ORIGINS
        value: https://kivora-frontend.onrender.com,http://localhost:5173
      - key: KIVORA_UPLOAD_DIR
        value: uploads
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_FROM_NAME
        value: "Kivora Platform"
      - key: SMTP_USE_TLS
        value: "true"

  # Kivora React Static Frontend Service
  - type: static
    name: kivora-frontend
    buildCommand: cd frontend && npm ci && npm run build
    publishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://kivora-api-n7m1.onrender.com

databases:
  # Managed PostgreSQL Database
  - name: kivora-postgres
    plan: free
    region: oregon
    databaseName: kivoradb
    user: kivora_user
