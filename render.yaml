services:
  - type: web
    name: kivora-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://kivora-api-jffe.onrender.com
    routes:
      - type: rewrite
        source: /api/*
        destination: https://kivora-api-jffe.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: kivora-backend
    env: python
    buildCommand: chmod +x start.sh && pip install -r backend/requirements.txt
    startCommand: ./start.sh
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        value: sqlite:///./kivora.db
      - key: SECRET_KEY
        generateValue: true
      - key: KIVORA_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false

